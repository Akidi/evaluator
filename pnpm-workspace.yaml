packages:
  - core
  - ui

allowBuilds:
  '@prisma/client': false
  '@tailwindcss/oxide': true
  # Ships Node-API prebuilds (prebuilds/win32-x64.node, NAPI 10); its binding.gyp
  # is a no-op when a prebuild matches the host, so skip the implicit node-gyp rebuild.
  better-sqlite3: false
  esbuild: true

engineStrict: true